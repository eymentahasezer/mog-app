<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mog-App AI Engine v2.0</title>
    <style>
        body { background: #0a0a0a; color: #f1f1f1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 420px; margin: 0 auto; background: #161616; padding: 25px; border-radius: 16px; border: 1px solid #2a2a2a; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { margin-top: 0; color: #3b82f6; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #aaa; font-size: 14px; }
        .config-box { background: #222; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: left; }
        .config-box input { width: 100%; padding: 8px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; margin-top: 5px; font-size: 12px; }
        .upload-btn-wrapper { margin: 20px 0; }
        input[type=file] { display: none; }
        .file-label { background: #222; border: 1px dashed #444; padding: 15px; border-radius: 8px; display: block; cursor: pointer; color: #3b82f6; font-weight: bold; }
        button { width: 100%; padding: 14px; background: #2563eb; color: #fff; font-weight: bold; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #444; cursor: not-allowed; }
        #preview { max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
        #result { margin-top: 25px; text-align: left; background: #1f1f1f; padding: 15px; border-radius: 10px; border-left: 4px solid #3b82f6; display: none; font-size: 14px; line-height: 1.6; white-space: pre-line; }
        .spinner { display: none; margin: 15px auto; border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mog & Face Rating AI</h2>
        <p>Biyo-geometrik Yüz Analiz Modülü</p>
        
        <!-- Güvenlik için gizli/ayarlanabilir alan -->
        <div class="config-box">
            <label style="font-size: 12px; color: #888;">Gemini API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="API Key'ini buraya yapıştır">
        </div>

        <div class="upload-btn-wrapper">
            <label for="imageInput" class="file-label" id="fileLabel">📸 Fotoğraf Seç veya Çek</label>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        </div>

        <img id="preview" alt="Yüklenen Yüz">
        
        <button id="analyzeBtn" onclick="analyzeFace()">Analizi Başlat</button>
        <div class="spinner" id="spinner"></div>

        <div id="result"></div>
    </div>

    <script>
        let base64Image = "";

        // Sayfa açıldığında daha önce kaydettiyse hatırla
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileLabel').innerText = "✓ " + file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    base64Image = e.target.result.split(',')[1];
                }
                reader.readAsDataURL(file);
            }
        }

        async function analyzeFace() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert("Önce Gemini API Key'ini gir bro!");
                return;
            }
            // Key'i tarayıcıya hafızaya al ki her seferinde yazma
            localStorage.setItem('gemini_api_key', apiKey);

            if (!base64Image) {
                alert("Lütfen önce bir fotoğraf yükle gardaş!");
                return;
            }

            const analyzeBtn = document.getElementById('analyzeBtn');
            const spinner = document.getElementById('spinner');
            const resultDiv = document.getElementById('result');

            analyzeBtn.disabled = true;
            spinner.style.display = 'block';
            resultDiv.style.display = 'none';

            const systemPrompt = `Sen profesyonel ve acımasız bir estetik, yüz metriği ve "mogging" uzmanısın. Fotoğraftaki yüzü şu kriterlere göre teknik olarak değerlendir:
1. Yüz Simetrisi ve Oranları (Midface, Lower Third)
2. Çene ve Kemik Yapısı (Jawline, Ramus, Gonial Angle)
3. Göz Bölgesi (Canthal Tilt, Eye Support, Hunter/Bug Eyes)
4. Genel "Mog" Puanı (1 ile 10 arasında tam puan ver)

Yanıtını Türkçe, doğrudan, resmi ama looksmaxxing terminolojisini bilerek ver. Gereksiz kibarlık yapma, tamamen objektif ol. Puanı en başta kalın harflerle belirt (Örn: **Genel Skor: 7.5 / 10**).`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: systemPrompt },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || "API Hatası oluştu.");
                }

                const aiText = data.candidates[0].content.parts[0].text;
                
                let formattedText = aiText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                resultDiv.innerHTML = formattedText;
                resultDiv.style.display = 'block';

            } catch (err) {
                alert("Hata oluştu: " + err.message);
            } finally {
                analyzeBtn.disabled = false;
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
