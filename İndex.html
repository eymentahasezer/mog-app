<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mog-App v1.0</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; background: #1a1a1a; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #2a2a2a; color: #fff; }
        button { background: #3b82f6; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
        #result { margin-top: 20px; text-align: left; background: #252525; padding: 15px; border-radius: 8px; display: none; }
        img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mog & Face Rating</h2>
        <p>Fotoğrafını yükle, sistem analiz etsin.</p>
        
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="analyzeFace()">Analiz Et</button>

        <div id="result">
            <h3>Analiz Sonucu</h3>
            <p id="analysisText">Yükleniyor...</p>
        </div>
    </div>

    <script>
        async function analyzeFace() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');
            const textP = document.getElementById('analysisText');

            if (fileInput.files.length === 0) {
                alert("Önce bir fotoğraf seç gardaş!");
                return;
            }

            resultDiv.style.display = 'block';
            textP.innerText = "Yapay zeka yüzü tarıyor, canthal tilt ve ramus hesaplanıyor...";

            // API entegrasyonu ve loglama mekanizması buraya eklenecek.
        }
    </script>
</body>
</html>
