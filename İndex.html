<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>25 Max App | Neural Face Rating</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #050510;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ----- ANİMASYONLU MESH GRADİENT ARKA PLAN ----- */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, #1a0533 0%, #050510 40%),
                        radial-gradient(circle at 80% 70%, #0f0520 0%, #050510 50%),
                        radial-gradient(circle at 40% 80%, #1a0a2e 0%, #050510 45%);
            background-blend-mode: screen;
            animation: meshMove 12s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            0% { background-position: 0% 0%, 100% 100%, 50% 50%; }
            100% { background-position: 5% 10%, 90% 85%, 45% 60%; }
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ----- GLASSMORPHISM KART ----- */
        .glass-card {
            background: rgba(18, 18, 24, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 45px -15px rgba(0,0,0,0.7), inset 0 0 30px rgba(255,255,255,0.02);
            padding: 30px 25px;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* ----- PİZZA LOGO VE BAŞLIK ----- */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .pizza-logo {
            width: 52px;
            height: 52px;
            position: relative;
            flex-shrink: 0;
        }

        .pizza-logo svg {
            width: 100%;
            height: 100%;
        }

        /* Peynir erime animasyonu */
        .cheese-drip {
            animation: cheeseDrip 2.5s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes cheeseDrip {
            0% {
                d: path("M20,14 Q26,10 32,14 L34,16 Q34,18 32,16 L26,12 Q24,10 26,12 L20,14 Z");
                opacity: 0.7;
            }
            25% {
                d: path("M20,14 Q26,10 32,14 L34,22 Q34,26 32,22 L26,14 Q24,16 26,14 L20,14 Z");
                opacity: 0.9;
            }
            50% {
                d: path("M20,14 Q26,10 32,14 L34,30 Q33,35 32,30 L26,18 Q24,22 26,18 L20,14 Z");
                opacity: 1;
            }
            75% {
                d: path("M20,14 Q26,10 32,14 L34,36 Q33,42 32,36 L26,22 Q24,28 26,22 L20,14 Z");
                opacity: 0.8;
            }
            100% {
                d: path("M20,14 Q26,10 32,14 L34,16 Q34,18 32,16 L26,12 Q24,10 26,12 L20,14 Z");
                opacity: 0.7;
            }
        }

        /* Peynir damlası */
        .cheese-blob {
            animation: cheeseBlob 2.5s ease-in-out infinite;
        }

        @keyframes cheeseBlob {
            0% {
                cy: 28;
                ry: 0;
                opacity: 0;
            }
            30% {
                cy: 32;
                ry: 3;
                opacity: 0.9;
            }
            60% {
                cy: 38;
                ry: 4.5;
                opacity: 1;
            }
            80% {
                cy: 42;
                ry: 5;
                opacity: 0.7;
            }
            90% {
                cy: 44;
                ry: 5.5;
                opacity: 0.3;
            }
            100% {
                cy: 46;
                ry: 1;
                opacity: 0;
            }
        }

        .blob-drop {
            animation: blobDrop 2.5s ease-in-out infinite;
        }

        @keyframes blobDrop {
            0%, 20% { opacity: 0; transform: translateY(0); }
            35% { opacity: 0.9; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(6px); }
            85% { opacity: 0.4; transform: translateY(12px); }
            100% { opacity: 0; transform: translateY(16px); }
        }

        h2 {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: 3px;
            margin: 0;
            background: linear-gradient(135deg, #f59e0b, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            line-height: 1;
        }

        .subtitle {
            color: #8b8b9e;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 28px;
            text-transform: uppercase;
        }

        /* API Key Input */
        .api-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            padding: 6px 6px 6px 16px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(6px);
        }
        .api-section label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #f59e0b;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .api-section input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 10px 5px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            outline: none;
        }
        .api-section input::placeholder {
            color: #555;
            font-family: 'Inter', sans-serif;
        }

        /* Yükleme Alanı */
        .file-upload-wrapper {
            margin: 20px 0 18px;
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(245, 158, 11, 0.3);
            border-radius: 18px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #ccc;
            letter-spacing: 0.5px;
            backdrop-filter: blur(6px);
        }
        .file-label:hover {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
            box-shadow: 0 0 20px rgba(245,158,11,0.15);
            color: #fff;
        }
        .file-label i {
            font-style: normal;
            font-size: 24px;
        }

        #preview {
            max-width: 100%;
            border-radius: 18px;
            margin: 20px 0 10px;
            display: none;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            transition: opacity 0.5s;
        }

        /* Ana Buton */
        .analyze-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #dc2626, #d97706);
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 800;
            font-size: 17px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            box-shadow: 0 10px 25px -10px rgba(220,38,38,0.5);
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .analyze-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -8px rgba(245,158,11,0.6);
            background: linear-gradient(135deg, #ef4444, #f59e0b);
        }
        .analyze-btn:disabled {
            background: #2a2a32;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* ----- CYBERPUNK TARAMA (SCANNER) EFEKTİ ----- */
        .scanner-container {
            display: none;
            margin: 25px auto 10px;
            width: 100%;
            height: 80px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(245,158,11,0.2);
        }
        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f59e0b, #dc2626, #f59e0b, transparent);
            box-shadow: 0 0 20px #f59e0b, 0 0 40px #dc2626;
            animation: scanDown 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
            z-index: 2;
        }
        @keyframes scanDown {
            0% { top: -5px; opacity: 0.6; }
            50% { top: 100%; opacity: 1; }
            100% { top: -5px; opacity: 0.6; }
        }
        .scanner-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'JetBrains Mono', monospace;
            color: #f59e0b;
            font-size: 14px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #dc2626;
            z-index: 3;
            animation: pulseText 1.5s infinite;
        }
        @keyframes pulseText {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Sonuç Kartı */
        .result-box {
            margin-top: 25px;
            text-align: left;
            background: rgba(10, 10, 18, 0.7);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            border-left: 5px solid #f59e0b;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 22px;
            display: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            line-height: 1.7;
            color: #d4d4d4;
            white-space: pre-line;
            word-break: break-word;
            box-shadow: 0 20px 35px -15px black;
            animation: fadeSlide 0.5s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-box {
            background: rgba(220, 38, 38, 0.1);
            border-left: 4px solid #ef4444;
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            backdrop-filter: blur(8px);
            font-weight: 500;
        }

        footer {
            margin-top: 25px;
            color: #4a4a5a;
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        /* Mobil uyum */
        @media (max-width: 400px) {
            .logo-container {
                gap: 4px;
            }
            .pizza-logo {
                width: 40px;
                height: 40px;
            }
            h2 {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>

    <div class="container">
        <div class="glass-card">
            
            <!-- PİZZA LOGO + BAŞLIK -->
            <div class="logo-container">
                <div class="pizza-logo">
                    <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
                        <!-- Pizza tabanı (hamur) -->
                        <circle cx="26" cy="26" r="24" fill="#d4a054" stroke="#b87a2b" stroke-width="2"/>
                        <!-- Pizza sosu -->
                        <circle cx="26" cy="26" r="21" fill="#c1272d"/>
                        <!-- Peynir tabakası -->
                        <circle cx="26" cy="26" r="19" fill="#f5d77b" opacity="0.9"/>
                        <!-- Peynir lekeleri -->
                        <circle cx="20" cy="20" r="4" fill="#fef3c7" opacity="0.8"/>
                        <circle cx="32" cy="22" r="3.5" fill="#fef3c7" opacity="0.7"/>
                        <circle cx="24" cy="30" r="3" fill="#fef3c7" opacity="0.75"/>
                        <!-- Pepperoni -->
                        <circle cx="18" cy="18" r="4.5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                        <circle cx="33" cy="24" r="4.5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                        <circle cx="22" cy="33" r="4.5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                        <circle cx="30" cy="32" r="4" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                        <!-- Peynir erime yolu (soldan aşağı) -->
                        <path class="cheese-drip" 
                              d="M20,14 Q26,10 32,14 L34,16 Q34,18 32,16 L26,12 Q24,10 26,12 L20,14 Z" 
                              fill="#fef3c7" opacity="0.7"/>
                        <!-- Eriyen peynir damlası -->
                        <ellipse class="cheese-blob" cx="27" cy="28" rx="2.5" ry="0" fill="#fef3c7" opacity="0">
                            <animate 
                                attributeName="ry" 
                                values="0;3;5;6;7;2;0" 
                                dur="2.5s" 
                                repeatCount="indefinite" 
                            />
                            <animate 
                                attributeName="cy" 
                                values="28;32;37;40;43;46;46" 
                                dur="2.5s" 
                                repeatCount="indefinite" 
                            />
                            <animate 
                                attributeName="opacity" 
                                values="0;0.9;1;0.8;0.5;0.2;0" 
                                dur="2.5s" 
                                repeatCount="indefinite" 
                            />
                        </ellipse>
                        <!-- Düşen peynir damlası -->
                        <ellipse cx="27" cy="46" rx="2" ry="1.5" fill="#fef3c7" opacity="0">
                            <animate 
                                attributeName="opacity" 
                                values="0;0;0;0.8;1;0.6;0" 
                                dur="2.5s" 
                                repeatCount="indefinite" 
                            />
                        </ellipse>
                    </svg>
                </div>
                <h2>25 MAX</h2>
            </div>
            
            <p class="subtitle">Neural Face Scoring Engine</p>

            <div class="api-section">
                <label>🔑</label>
                <input type="password" id="apiKeyInput" placeholder="Gemini API Key" autocomplete="off">
            </div>

            <div class="file-upload-wrapper">
                <label for="imageInput" class="file-label" id="fileLabel">
                    <i>📸</i> YÜZ TARAMASI İÇİN DOKUN
                </label>
                <input type="file" id="imageInput" accept="image/*" capture="user" onchange="previewImage(event)">
            </div>

            <img id="preview" alt="Yüz Önizleme">

            <button class="analyze-btn" id="analyzeBtn" onclick="analyzeFace()">
                <span id="btnText">TARAMAYI BAŞLAT</span>
            </button>

            <div class="scanner-container" id="scannerEffect">
                <div class="scanner-line"></div>
                <div class="scanner-text">◈ ANALİZ EDİLİYOR ◈</div>
            </div>

            <div class="error-box" id="errorBox"></div>
            <div class="result-box" id="result"></div>
            <footer>25 MAX APP • BLACKPILL TERMINAL</footer>
        </div>
    </div>

    <script>
        const MODEL_NAME = 'gemini-1.5-pro';
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent`;
        
        let base64Image = "";
        let currentMimeType = "image/jpeg";
        const MAX_SIZE_MB = 5;

        window.onload = () => {
            const savedKey = localStorage.getItem('25max_key_v5');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            document.getElementById('imageInput').value = "";
        };

        function previewImage(event) {
            const file = event.target.files[0];
            const errorBox = document.getElementById('errorBox');
            const preview = document.getElementById('preview');
            const fileLabel = document.getElementById('fileLabel');
            
            errorBox.style.display = 'none';
            document.getElementById('result').style.display = 'none';

            if (!file) {
                resetUpload();
                return;
            }

            if (!file.type.startsWith('image/')) {
                showError("Geçersiz dosya türü! JPEG, PNG veya WebP yükle.");
                resetUpload();
                return;
            }

            if (file.size > MAX_SIZE_MB * 1024 * 1024) {
                showError(`Dosya ${MAX_SIZE_MB}MB'dan büyük olamaz.`);
                resetUpload();
                return;
            }

            currentMimeType = file.type;
            fileLabel.innerHTML = `✓ ${file.name} (${(file.size/1024).toFixed(1)} KB)`;

            const reader = new FileReader();
            reader.onerror = () => { showError("Okuma hatası."); resetUpload(); };
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    if (img.width < 80 || img.height < 80) {
                        showError("Görsel çok küçük (min 80x80).");
                        resetUpload();
                        return;
                    }
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    const parts = e.target.result.split(',');
                    base64Image = parts.length === 2 ? parts[1] : "";
                    if (!base64Image) showError("Base64 hatası.");
                };
                img.onerror = () => { showError("Bozuk görsel."); resetUpload(); };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetUpload() {
            document.getElementById('imageInput').value = "";
            document.getElementById('preview').style.display = 'none';
            document.getElementById('fileLabel').innerHTML = '<i>📸</i> YÜZ TARAMASI İÇİN DOKUN';
            base64Image = "";
            currentMimeType = "image/jpeg";
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.textContent = `⚠️ ${msg}`;
            box.style.display = 'block';
            setTimeout(() => { if (box) box.style.display = 'none'; }, 6000);
        }

        async function analyzeFace() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const btn = document.getElementById('analyzeBtn');
            const btnText = document.getElementById('btnText');
            const scanner = document.getElementById('scannerEffect');
            const resultDiv = document.getElementById('result');
            const errorBox = document.getElementById('errorBox');

            resultDiv.style.display = 'none';
            errorBox.style.display = 'none';

            if (!apiKey || apiKey.length < 20) {
                showError("Geçerli bir Gemini API anahtarı gir.");
                return;
            }
            if (!base64Image) {
                showError("Önce bir yüz fotoğrafı yükle.");
                return;
            }

            localStorage.setItem('25max_key_v5', apiKey);
            btn.disabled = true;
            btnText.textContent = "TARANIYOR...";
            scanner.style.display = 'block';

            const prompt = `Sen bir yapay zeka estetik derecelendirme motorusun. Yüklenen insan yüzünü acımasızca, yalnızca biyo-geometrik ve bilimsel kriterlere göre değerlendir. Kesinlikle iltifat etme, duygusal yorum katma. Türkçe konuş, fakat terimleri İngilizce orijinal kullan (gonial angle, canthal tilt, UEE, midface ratio, IPD, scleral show, vs.).

Aşağıdaki 5 kategoriyi 1-10 arası puanla, kısa yorumlar yap ve en son "MOG SKORU" ver.

1. ÇENE & KEMİK (Gonial Angle, Ramus, Chin, Zygos)
2. GÖZ BÖLGESİ (Canthal Tilt, UEE, Brow Ridge, IPD)
3. ORTA YÜZ & BURUN (Midface Ratio, Dorsal, Tip)
4. DUDAK & ALT YÜZ (Lower Third, Philtrum)
5. SİMETRİ & CİLT/SAÇ (Asimetri, Akne, Norwood)

Çıktı formatın tam olarak şu olmalı (HR dahil):
---
**🔥 25 MAX ANALİZ RAPORU**

**Çene & Kemik: [X.X]/10**
[Yorum]

**Göz Bölgesi: [X.X]/10**
[Yorum]

**Orta Yüz & Burun: [X.X]/10**
[Yorum]

**Dudak & Alt Yüz: [X.X]/10**
[Yorum]

**Simetri & Sağlık: [X.X]/10**
[Yorum]

---
**🏆 GENEL MOG SKORU: [X.X] / 10**

**En Büyük Kusur (Failo):** [Tek cümle]
**En Güçlü Yan (Halo):** [Tek cümle]
---
Gerçekler acıtır, acımasız ol.`;

            try {
                const response = await fetch(`${API_URL}?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: currentMimeType, data: base64Image } }
                            ]
                        }],
                        generationConfig: { temperature: 0.3, maxOutputTokens: 1100 }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!aiText) throw new Error("AI yanıtı boş veya geçersiz.");

                let formatted = aiText
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/---/g, '<hr style="border-color:#333; margin:15px 0;">')
                    .replace(/\n/g, '<br>');

                resultDiv.innerHTML = formatted;
                resultDiv.style.display = 'block';
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (err) {
                showError(`Hata: ${err.message}`);
            } finally {
                btn.disabled = false;
                btnText.textContent = "TARAMAYI BAŞLAT";
                scanner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
