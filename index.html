<script>
  (function() {
    // ★ SENİN GIF'İN ★
    const GIF_URL = "https://i.makeagif.com/media/12-12-2023/O_rv3C.gif";

    // Overlay oluştur
    const overlay = document.createElement("div");
    overlay.id = "jeff-overlay";
    overlay.style.cssText = `
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    `;

    // GIF'i ekle
    const img = document.createElement("img");
    img.style.cssText = `
      width: 100%;
      height: 100%;
      object-fit: cover;
    `;
    img.src = GIF_URL;
    img.alt = "Jeff the Killer";
    
    // Yedek: GIF yüklenmezse
    img.onerror = function() {
      this.style.display = "none";
      overlay.style.background = "black";
      overlay.innerHTML = `
        <div style="color:red;font-size:80px;text-align:center;font-family:arial;animation:blink 0.5s infinite;">
          💀 JEFF<br>
          <span style="font-size:20px;">(GIF yüklenemedi ama korku devam ediyor)</span>
        </div>
        <style>
          @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
          }
        </style>
      `;
    };

    overlay.appendChild(img);
    document.body.appendChild(overlay);

    // Tıklayınca kapat
    overlay.onclick = function() {
      this.style.display = "none";
      // GIF'i durdur ve sıfırla
      img.src = "";
      setTimeout(() => { img.src = GIF_URL; }, 100);
    };

    // Rastgele 2-5 saniye sonra göster
    const delay = 2000 + Math.random() * 3000;
    
    setTimeout(() => {
      overlay.style.display = "flex";
      overlay.style.animation = "jeffAppear 0.6s ease-out";
      
      // Çığlık sesi efekti
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        // Korkutucu tiz ses
        oscillator.frequency.setValueAtTime(1500, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.6);
        oscillator.type = "sawtooth";
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 0.6);
      } catch(e) {}
      
      // 6 saniye sonra otomatik kaybol
      setTimeout(() => {
        overlay.style.display = "none";
        img.src = "";
        setTimeout(() => { img.src = GIF_URL; }, 100);
      }, 6000);
      
    }, delay);

    // CSS animasyonlarını ekle
    const style = document.createElement("style");
    style.textContent = `
      @keyframes jeffAppear {
        0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
        60% { transform: scale(1.3) rotate(3deg); }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }
    `;
    document.head.appendChild(style);

    console.log("🔪 Jeff GIF hazır! " + (delay/1000) + " saniye sonra patlayacak!");
  })();
</script>
