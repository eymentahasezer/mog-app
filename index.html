<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>25 Max App | Face Rating</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(0, 255, 65, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 200, 50, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.8) 0%, transparent 60%);
            animation: glowPulse 8s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        .glass-card {
            background: rgba(22, 22, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 35px 25px;
            text-align: center;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .pizza-container {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            position: relative;
        }

        .pizza-container svg {
            width: 100%;
            height: 100%;
        }

        @keyframes cheeseMelt {
            0% {
                d: path("M18,16 Q22,10 28,16 L29,17 Q29,19 28,17 Q24,12 22,14 L18,16 Z");
                opacity: 0.4;
            }
            20% {
                d: path("M18,16 Q22,10 28,16 L30,24 Q31,28 29,24 Q26,15 22,14 L18,16 Z");
                opacity: 0.9;
            }
            45% {
                d: path("M18,16 Q22,10 28,16 L31,34 Q32,40 30,34 Q27,20 22,14 L18,16 Z");
                opacity: 1;
            }
            70% {
                d: path("M18,16 Q22,10 28,16 L31,40 Q32,46 30,40 Q27,24 22,14 L18,16 Z");
                opacity: 0.6;
            }
            85% {
                d: path("M18,16 Q22,10 28,16 L29,20 Q29,22 28,20 Q24,13 22,14 L18,16 Z");
                opacity: 0.3;
            }
            100% {
                d: path("M18,16 Q22,10 28,16 L29,17 Q29,19 28,17 Q24,12 22,14 L18,16 Z");
                opacity: 0.4;
            }
        }

        .melting-cheese {
            animation: cheeseMelt 3s ease-in-out infinite;
        }

        @keyframes dripDrop {
            0% { transform: translateY(0); opacity: 0; }
            30% { transform: translateY(8px); opacity: 1; }
            60% { transform: translateY(18px); opacity: 0.8; }
            80% { transform: translateY(26px); opacity: 0.3; }
            100% { transform: translateY(32px); opacity: 0; }
        }

        .drip {
            animation: dripDrop 3s ease-in-out infinite;
        }

        h2 {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: 3px;
            margin: 0;
            background: linear-gradient(135deg, #00ff41, #00c830);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            line-height: 1;
        }

        .subtitle {
            color: #888;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .input-group {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 14px;
            padding: 8px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .input-group .icon {
            font-size: 18px;
            flex-shrink: 0;
        }
        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            outline: none;
        }
        .input-group input::placeholder {
            color: #555;
            font-family: 'Inter', sans-serif;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00c830, #00ff41);
            box-shadow: 0 8px 25px rgba(0, 255, 65, 0.3);
            color: #000;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 255, 65, 0.5);
        }
        .btn-primary:disabled {
            background: #2a2a35;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(0, 255, 65, 0.4);
            color: #00ff41;
            margin-top: 12px;
        }
        .btn-outline:hover {
            background: rgba(0, 255, 65, 0.1);
            border-color: #00ff41;
        }

        .upload-buttons {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        .upload-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed rgba(0, 255, 65, 0.3);
            color: #00ff41;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: center;
        }
        .upload-btn:hover {
            border-color: #00ff41;
            background: rgba(0, 255, 65, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.15);
        }
        input[type="file"] {
            display: none;
        }

        .preview-scanner-wrapper {
            position: relative;
            display: none;
            margin: 15px 0;
        }
        .preview-scanner-wrapper.active {
            display: block;
        }

        #preview {
            width: 100%;
            border-radius: 16px;
            display: block;
            border: 2px solid rgba(0, 255, 65, 0.3);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            border-radius: 16px;
        }

        .scan-line-h {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff41, #00ff41, transparent);
            box-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41, 0 0 80px #00cc33;
            animation: scanVertical 2s ease-in-out infinite;
        }
        @keyframes scanVertical {
            0% { top: -5px; }
            50% { top: 100%; }
            100% { top: -5px; }
        }

        .scan-line-v {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background: linear-gradient(180deg, transparent, #00ff41, #00ff41, transparent);
            box-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41, 0 0 80px #00cc33;
            animation: scanHorizontal 2s ease-in-out infinite;
            animation-delay: 0.5s;
        }
        @keyframes scanHorizontal {
            0% { left: -5px; }
            50% { left: 100%; }
            100% { left: -5px; }
        }

        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #00ff41;
            border-style: solid;
            box-shadow: 0 0 10px #00ff41;
        }
        .corner-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
        .corner-tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
        .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

        .scanning-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'JetBrains Mono', monospace;
            color: #00ff41;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #00ff41, 0 0 40px #00cc33;
            animation: pulseText 1.5s ease-in-out infinite;
            z-index: 5;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 65, 0.4);
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.6; text-shadow: 0 0 20px #00ff41; }
            50% { opacity: 1; text-shadow: 0 0 40px #00ff41, 0 0 60px #00cc33; }
        }

        .result-box {
            margin-top: 20px;
            text-align: left;
            background: rgba(15, 15, 22, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 18px;
            border-left: 4px solid #00ff41;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px;
            display: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.7;
            color: #ccc;
            white-space: pre-line;
            word-break: break-word;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-box {
            background: rgba(220, 38, 38, 0.1);
            border-left: 4px solid #ef4444;
            color: #fca5a5;
            padding: 14px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }

        footer {
            margin-top: 20px;
            color: #444;
            font-size: 11px;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="container">
        
        <!-- ========== SAYFA 1: API KEY GİRİŞ ========== -->
        <div class="page active" id="pageLogin">
            <div class="glass-card">
                <div class="logo-wrapper">
                    <div class="pizza-container">
                        <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="30" cy="30" r="27" fill="#d4a054" stroke="#b87a2b" stroke-width="2"/>
                            <circle cx="30" cy="30" r="24" fill="#c1272d"/>
                            <circle cx="30" cy="30" r="22" fill="#f8d56b"/>
                            <circle cx="22" cy="22" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="37" cy="26" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="28" cy="37" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="36" cy="35" r="4.5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <path class="melting-cheese" 
                                  d="M20,14 Q24,10 30,14 L31,16 Q31,18 30,16 Q26,12 24,14 L20,14 Z" 
                                  fill="#fff8dc" opacity="0.6"/>
                            <circle class="drip" cx="27" cy="36" r="3" fill="#fff8dc" opacity="0">
                                <animate attributeName="cy" values="34;42;50;50" dur="3s" repeatCount="indefinite"/>
                                <animate attributeName="opacity" values="0;1;0.6;0" dur="3s" repeatCount="indefinite"/>
                                <animate attributeName="r" values="2;3.5;4;1" dur="3s" repeatCount="indefinite"/>
                            </circle>
                        </svg>
                    </div>
                    <h2>25 MAX</h2>
                </div>
                <p class="subtitle">AI Face Rating Terminal</p>

                <div class="input-group">
                    <span class="icon">🔑</span>
                    <input type="password" id="apiKeyInput" placeholder="Gemini API Key giriniz..." autocomplete="off">
                </div>

                <button class="btn btn-primary" id="btnLogin">
                    GİRİŞ YAP
                </button>

                <div class="error-box" id="loginError"></div>
                <footer>v9.0 • Blackpill Engine</footer>
            </div>
        </div>

        <!-- ========== SAYFA 2: YÜZ ANALİZ ========== -->
        <div class="page" id="pageAnalyze">
            <div class="glass-card">
                <div class="logo-wrapper">
                    <div class="pizza-container" style="width:45px;height:45px;">
                        <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="30" cy="30" r="27" fill="#d4a054" stroke="#b87a2b" stroke-width="2"/>
                            <circle cx="30" cy="30" r="24" fill="#c1272d"/>
                            <circle cx="30" cy="30" r="22" fill="#f8d56b"/>
                            <circle cx="22" cy="22" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="37" cy="26" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="28" cy="37" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="36" cy="35" r="4.5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <path class="melting-cheese" 
                                  d="M20,14 Q24,10 30,14 L31,16 Q31,18 30,16 Q26,12 24,14 L20,14 Z" 
                                  fill="#fff8dc" opacity="0.6"/>
                            <circle class="drip" cx="27" cy="36" r="3" fill="#fff8dc" opacity="0">
                                <animate attributeName="cy" values="34;42;50;50" dur="3s" repeatCount="indefinite"/>
                                <animate attributeName="opacity" values="0;1;0.6;0" dur="3s" repeatCount="indefinite"/>
                                <animate attributeName="r" values="2;3.5;4;1" dur="3s" repeatCount="indefinite"/>
                            </circle>
                        </svg>
                    </div>
                    <h2 style="font-size:1.5rem;">25 MAX</h2>
                </div>
                <p class="subtitle">Yüz Analizi</p>

                <div class="upload-buttons">
                    <label for="galleryInput" class="upload-btn">
                        🖼️ GALERİ
                    </label>
                    <input type="file" id="galleryInput" accept="image/*">
                    
                    <label for="cameraInput" class="upload-btn">
                        📷 KAMERA
                    </label>
                    <input type="file" id="cameraInput" accept="image/*" capture="user">
                </div>

                <div class="preview-scanner-wrapper" id="previewWrapper">
                    <img id="preview" alt="Seçilen fotoğraf">
                    <div class="scanner-overlay" id="scannerOverlay" style="display:none;">
                        <div class="scan-line-h"></div>
                        <div class="scan-line-v"></div>
                        <div class="corner corner-tl"></div>
                        <div class="corner corner-tr"></div>
                        <div class="corner corner-bl"></div>
                        <div class="corner corner-br"></div>
                        <div class="scanning-label">◈ ANALİZ EDİLİYOR ◈</div>
                    </div>
                </div>

                <button class="btn btn-primary" id="btnAnalyze">
                    <span id="btnText">ANALİZİ BAŞLAT</span>
                </button>

                <button class="btn btn-outline" id="btnLogout">
                    ↩ ÇIKIŞ YAP
                </button>

                <div class="error-box" id="analyzeError"></div>
                <div class="result-box" id="result"></div>
            </div>
        </div>

    </div>

    <script>
        // GÜNCEL MODEL: gemini-3.6-flash
        const MODEL_NAME = 'gemini-3.6-flash';
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent`;
        
        let base64Image = "";
        let currentMimeType = "image/jpeg";
        const MAX_SIZE_MB = 5;

        const pageLogin = document.getElementById('pageLogin');
        const pageAnalyze = document.getElementById('pageAnalyze');

        function showPage(page) {
            pageLogin.classList.remove('active');
            pageAnalyze.classList.remove('active');
            page.classList.add('active');
        }

        // Otomatik giriş kontrolü
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('25max_api_key_v9');
            if (savedKey && savedKey.length > 20) {
                showPage(pageAnalyze);
            }
        });

        // ---------- GİRİŞ BUTONU ----------
        document.getElementById('btnLogin').addEventListener('click', () => {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const errorBox = document.getElementById('loginError');
            
            errorBox.style.display = 'none';

            if (!apiKey || apiKey.length < 20) {
                errorBox.textContent = '⚠️ Geçerli bir Gemini API Key giriniz!';
                errorBox.style.display = 'block';
                return;
            }

            localStorage.setItem('25max_api_key_v9', apiKey);
            document.getElementById('apiKeyInput').value = '';
            showPage(pageAnalyze);
        });

        // Enter ile giriş
        document.getElementById('apiKeyInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('btnLogin').click();
            }
        });

        // ---------- ÇIKIŞ BUTONU ----------
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('25max_api_key_v9');
            document.getElementById('apiKeyInput').value = '';
            resetUpload();
            document.getElementById('result').style.display = 'none';
            document.getElementById('analyzeError').style.display = 'none';
            showPage(pageLogin);
        });

        // ---------- GÖRSEL YÜKLEME ----------
        document.getElementById('galleryInput').addEventListener('change', function(event) {
            handleFileSelect(event.target.files[0]);
        });

        document.getElementById('cameraInput').addEventListener('change', function(event) {
            handleFileSelect(event.target.files[0]);
        });

        function handleFileSelect(file) {
            const errorBox = document.getElementById('analyzeError');
            const preview = document.getElementById('preview');
            const previewWrapper = document.getElementById('previewWrapper');
            const scannerOverlay = document.getElementById('scannerOverlay');
            
            errorBox.style.display = 'none';
            document.getElementById('result').style.display = 'none';
            scannerOverlay.style.display = 'none';

            if (!file) {
                resetUpload();
                return;
            }

            if (!file.type.startsWith('image/')) {
                showAnalyzeError("Geçersiz dosya! JPEG, PNG veya WebP seçin.");
                resetUpload();
                return;
            }

            if (file.size > MAX_SIZE_MB * 1024 * 1024) {
                showAnalyzeError(`Dosya ${MAX_SIZE_MB}MB'dan küçük olmalı!`);
                resetUpload();
                return;
            }

            currentMimeType = file.type;

            const reader = new FileReader();
            reader.onerror = () => { showAnalyzeError("Dosya okunamadı!"); resetUpload(); };
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    if (img.width < 80 || img.height < 80) {
                        showAnalyzeError("Fotoğraf çok küçük (min 80x80 piksel).");
                        resetUpload();
                        return;
                    }
                    preview.src = e.target.result;
                    previewWrapper.classList.add('active');
                    const parts = e.target.result.split(',');
                    base64Image = parts.length === 2 ? parts[1] : "";
                };
                img.onerror = () => { showAnalyzeError("Görsel bozuk veya geçersiz!"); resetUpload(); };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetUpload() {
            document.getElementById('galleryInput').value = "";
            document.getElementById('cameraInput').value = "";
            document.getElementById('previewWrapper').classList.remove('active');
            document.getElementById('preview').src = "";
            document.getElementById('scannerOverlay').style.display = 'none';
            base64Image = "";
            currentMimeType = "image/jpeg";
        }

        function showAnalyzeError(msg) {
            const box = document.getElementById('analyzeError');
            box.textContent = '⚠️ ' + msg;
            box.style.display = 'block';
            setTimeout(() => { if (box) box.style.display = 'none'; }, 5000);
        }

        // ---------- ANALİZ BUTONU ----------
        document.getElementById('btnAnalyze').addEventListener('click', async () => {
            const apiKey = localStorage.getItem('25max_api_key_v9');
            const btn = document.getElementById('btnAnalyze');
            const btnText = document.getElementById('btnText');
            const scannerOverlay = document.getElementById('scannerOverlay');
            const resultDiv = document.getElementById('result');
            const errorBox = document.getElementById('analyzeError');

            resultDiv.style.display = 'none';
            errorBox.style.display = 'none';

            if (!apiKey) {
                showAnalyzeError("API anahtarı bulunamadı! Lütfen tekrar giriş yapın.");
                return;
            }
            if (!base64Image) {
                showAnalyzeError("Lütfen önce bir fotoğraf seçin!");
                return;
            }

            btn.disabled = true;
            btnText.textContent = "ANALİZ EDİLİYOR...";
            scannerOverlay.style.display = 'block';

            const prompt = `Sen bir yapay zeka estetik derecelendirme motorusun. Yüklenen insan yüzünü acımasızca, yalnızca biyo-geometrik ve bilimsel kriterlere göre değerlendir. Kesinlikle iltifat etme, duygusal yorum katma. Türkçe konuş, fakat terimleri İngilizce orijinal kullan (gonial angle, canthal tilt, UEE, midface ratio, IPD, scleral show, vs.).

Aşağıdaki 5 kategoriyi 1-10 arası puanla, kısa yorumlar yap ve en son "MOG SKORU" ver.

1. ÇENE & KEMİK (Gonial Angle, Ramus, Chin, Zygos)
2. GÖZ BÖLGESİ (Canthal Tilt, UEE, Brow Ridge, IPD)
3. ORTA YÜZ & BURUN (Midface Ratio, Dorsal, Tip)
4. DUDAK & ALT YÜZ (Lower Third, Philtrum)
5. SİMETRİ & CİLT/SAÇ (Asimetri, Akne, Norwood)

Çıktı formatın tam olarak şu olmalı:
---
**🔥 25 MAX ANALİZ RAPORU**

**Çene & Kemik: [X.X]/10**
[Yorum]

**Göz Bölgesi: [X.X]/10**
[Yorum]

            try {
                const response = await fetch(`${API_URL}?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: currentMimeType, data: base64Image } }
                            ]
                        }],
                        generationConfig: { temperature: 0.3, maxOutputTokens: 1100 }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!aiText) throw new Error("AI yanıtı boş geldi, tekrar deneyin.");

                let formatted = aiText
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/\*\*(.*?)\*\*/g, '<strong style="color:#00ff41;">$1</strong>')
                    .replace(/---/g, '<hr style="border-color:#333; margin:15px 0;">')
                    .replace(/\n/g, '<br>');

                resultDiv.innerHTML = formatted;
                resultDiv.style.display = 'block';
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (err) {
                showAnalyzeError('Hata: ' + err.message);
            } finally {
                btn.disabled = false;
                btnText.textContent = "ANALİZİ BAŞLAT";
