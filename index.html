<script>
  (function() {
    // YÜKSEK KALİTELİ VE BÜYÜK BİR GÖRSEL KULLAN (direkt Wikipedia'dan)
    const IMAGE_URL = "https://upload.wikimedia.org/wikipedia/en/7/7d/Jeff_the_Killer_Original_edited_image.png";

    function addStyle(css) {
      const style = document.createElement("style");
      style.appendChild(new Text(css));
      document.head.appendChild(style);
      return style.sheet;
    }

    // Basitleştirilmiş ve garantili çalışan animasyon
    addStyle(`
      #jeff-overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        background: black;
        display: none;
        justify-content: center;
        align-items: center;
      }
      #jeff-overlay img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #jeff-overlay.show {
        display: flex;
        animation: jeffFadeIn 0.5s ease-in;
      }
      @keyframes jeffFadeIn {
        0% { opacity: 0; transform: scale(1.5); }
        100% { opacity: 1; transform: scale(1); }
      }
    `);

    // Overlay oluştur
    const overlay = document.createElement("div");
    overlay.id = "jeff-overlay";
    
    const img = document.createElement("img");
    img.src = IMAGE_URL;
    img.alt = "Jeff the Killer";
    img.onerror = function() {
      // Eğer resim yüklenmezse, yedek bir renk göster
      this.style.display = "none";
      overlay.style.background = "red";
      overlay.innerHTML = "<h1 style='color:white;font-size:100px;'>JEFF</h1>";
    };
    
    overlay.appendChild(img);
    document.body.appendChild(overlay);

    // Rastgele gecikme (1-4 saniye)
    const delay = 1000 + Math.random() * 3000;
    
    setTimeout(() => {
      overlay.classList.add("show");
      
      // Ses efekti (isteğe bağlı)
      try {
        const audio = new Audio('data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVoAAACAgICAgICAf39/f39/f3+AgICAgICAgICAgICAgH9/f39/f3+AgICAgICAgICAgICAgH9/f39/f3+AgICAAAA=');
        audio.volume = 0.3;
        audio.play();
      } catch(e) {}
      
      // 5 saniye sonra kaybol (isteğe bağlı)
      setTimeout(() => {
        overlay.classList.remove("show");
        overlay.style.display = "none";
      }, 5000);
      
    }, delay);

    console.log("Jeff the Killer hazır! " + delay/1000 + " saniye sonra gelecek.");
  })();
</script>
