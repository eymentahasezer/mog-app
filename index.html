<script>
  // EN BASİT JUMBSCARE - BEYAZ EKRAN YOK, SADECE SİYAH + KIRMIZI YAZI + SES
  (function() {
    // 1. Siyah overlay'i direkt oluştur
    const overlay = document.createElement('div');
    overlay.style.cssText = `
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: black;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    `;

    // 2. Büyük kırmızı "JEFF" yazısı (resim yüklenene kadar bu görünür)
    const text = document.createElement('div');
    text.style.cssText = `
      color: #ff0000;
      font-size: 120px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      text-shadow: 0 0 50px #ff0000, 0 0 100px #ff0000;
      animation: pulse 0.5s infinite alternate;
    `;
    text.textContent = 'JEFF';
    overlay.appendChild(text);

    // 3. Animasyonu ekle
    const style = document.createElement('style');
    style.textContent = `
      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(1.3); opacity: 0.7; }
      }
    `;
    document.head.appendChild(style);

    // 4. Sayfaya ekle
    document.body.appendChild(overlay);

    // 5. Ses efekti (çığlık)
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
      oscillator.type = 'sawtooth';
      gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      oscillator.start(audioCtx.currentTime);
      oscillator.stop(audioCtx.currentTime + 0.4);
    } catch(e) {}

    // 6. Tıklayınca kapat
    overlay.onclick = function() {
      this.remove();
    };

    // 7. (İSTEĞE BAĞLI) GIF'i yüklemeyi dene, yüklenirse yazının yerine geçer
    const img = new Image();
    img.src = 'https://i.makeagif.com/media/12-12-2023/O_rv3C.gif';
    img.style.cssText = `
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: none;
    `;
    img.onload = function() {
      text.style.display = 'none';  // yazıyı gizle
      overlay.appendChild(img);
      img.style.display = 'block';
    };
    img.onerror = function() {
      // GIF yüklenmezse yazı kalsın, sorun yok
    };
    overlay.appendChild(img);  // önceden ekle, arkaplanda yüklensin

    console.log('💀 Jumpscare hazır!');
  })();
</script>
