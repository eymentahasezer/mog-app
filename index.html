<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mog app</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000; /* Arka planı simsiyah yaptık */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
    }

    #fake-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .loader {
      border: 3px solid #222;
      border-top: 3px solid #007aff;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    p {
      color: #8e8e93;
      font-size: 15px;
      font-weight: 400;
      margin-top: 10px;
    }

    #scare-video {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Ekranı ne olursa olsun tam doldurur */
      z-index: 99999;
    }
  </style>
</head>
<body>

  <!-- Tuzak Ekranı -->
  <div id="fake-content">
    <div class="loader"></div>
    <p>Bağlantı güvenli...</p>
    <p style="font-size: 12px; margin-top: 5px;">Açmak için ekrana dokunun</p>
  </div>

  <!-- Dosya adının jumpscare.mp4 olduğundan artık eminiz -->
  <video id="scare-video" playsinline webkit-playsinline preload="auto">
    <source src="jumpscare.mp4" type="video/mp4" />
  </video>

  <script>
    const fakeContent = document.getElementById('fake-content');
    const scareVideo = document.getElementById('scare-video');

    let triggered = false;

    function triggerJumpscare() {
      if (triggered) return;
      triggered = true;

      // 1. Yazıları sil, videoyu ekrana al
      fakeContent.style.display = 'none';
      scareVideo.style.display = 'block';

      // 2. Tam ekrana geç ve telefonu YATAY (Landscape) moda zorla
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(e => console.log("Yatay kilitlenemedi"));
          }
        }).catch(err => console.log(err));
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen(); // iPhone (iOS) tayfası için
      }

      // 3. Videoyu zorla yükle ve patlat
      scareVideo.load();
      scareVideo.volume = 1.0;
      scareVideo.muted = false;
      
      let playPromise = scareVideo.play();
      
      // Eğer tarayıcı sesi engellerse hata vermesin, sessiz de olsa yüzüne patlasın diye by-pass
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.log("Tarayıcı sesi engelledi, alternatif başlatılıyor...");
          scareVideo.muted = true;
          scareVideo.play();
        });
      }
    }

    // Ekrana dokunulduğunda tetikle
    window.addEventListener('click', triggerJumpscare);
    window.addEventListener('touchstart', triggerJumpscare);
  </script>
</body>
</html>
