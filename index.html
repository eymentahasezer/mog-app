<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notlar / Belge</title>
  
  <!-- Instagram ve Sosyal Medya Önizlemesini Gizleme / Temizleme -->
  <meta property="og:title" content="Paylaşılan Belge" />
  <meta property="og:description" content="Yüklenen dosyayı görüntülemek için dokun." />
  <meta property="og:image" content="" />
  <meta name="twitter:card" content="summary" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f0f;
      cursor: pointer;
    }

    /* Masum, sade bir yüklenme veya belge ekranı */
    #fake-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
      text-align: center;
      color: #fff;
    }

    .loader {
      border: 4px solid #333;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    p {
      font-size: 1.1rem;
      color: #aaa;
      letter-spacing: 0.5px;
    }

    /* Jumpscare ekranı */
    #jumpscare {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 99999;
    }

    #jumpscare img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <!-- Masum Yüklenme Ekranı (Tetikleyici Alan) -->
  <div id="fake-content">
    <div class="loader"></div>
    <p>Belge yükleniyor, lütfen bekleyin...</p>
  </div>

  <!-- Jumpscare -->
  <div id="jumpscare">
    <img id="jumpscare-image" src="" alt="Jumpscare" />
  </div>

  <script>
    const fakeContent = document.getElementById('fake-content');
    const jumpscare = document.getElementById('jumpscare');
    const jumpscareImage = document.getElementById('jumpscare-image');

    // Korkunç Görsel ve Ses Linkleri
    const JEFF_IMAGE_URL = "https://i.pinimg.com/originals/8a/65/38/8a6538d4f8b82e1a1b5c7e3f9d0e2c1a.jpg";
    const JEFF_SOUND_URL = "https://www.myinstants.com/media/sounds/jeff-the-killer-scream.mp3";

    let triggered = false;

    // Sayfada HERHANGİ BİR YERE ilk dokunuşta/tıklamada patlat
    function triggerTrap(e) {
      if (triggered) return;
      triggered = true;

      // Tam ekran moduna zorla
      try {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
      } catch (err) {
        console.log("Fullscreen hatası:", err);
      }

      // Görseli yükle ve göster
      jumpscareImage.src = JEFF_IMAGE_URL;
      fakeContent.style.display = 'none';
      jumpscare.style.display = 'block';

      // Sesi son ses çal
      const audio = new Audio(JEFF_SOUND_URL);
      audio.volume = 1.0;
      audio.play().catch(err => console.log("Ses çalınamadı:", err));
    }

    // Hem tıklama hem dokunma (mobil dahil) olaylarını dinle
    window.addEventListener('click', triggerTrap);
    window.addEventListener('touchstart', triggerTrap);
  </script>
</body>
</html>
