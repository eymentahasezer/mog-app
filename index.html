<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>25 Max App | Face Rating</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Arka plan efekti */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(220, 38, 38, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 60%);
            animation: glowPulse 8s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* SAYFA GEÇİŞLERİ */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        .glass-card {
            background: rgba(22, 22, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 35px 25px;
            text-align: center;
        }

        /* ----- PİZZA LOGOSU (YENİ TASARIM) ----- */
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .pizza-container {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            position: relative;
        }

        .pizza-container svg {
            width: 100%;
            height: 100%;
        }

        /* Kaşar erime ve geri dönme animasyonu */
        @keyframes cheeseMelt {
            0% {
                d: path("M18,16 Q22,10 28,16 L29,17 Q29,19 28,17 Q24,12 22,14 L18,16 Z");
                opacity: 0.4;
            }
            20% {
                d: path("M18,16 Q22,10 28,16 L30,24 Q31,28 29,24 Q26,15 22,14 L18,16 Z");
                opacity: 0.9;
            }
            45% {
                d: path("M18,16 Q22,10 28,16 L31,34 Q32,40 30,34 Q27,20 22,14 L18,16 Z");
                opacity: 1;
            }
            70% {
                d: path("M18,16 Q22,10 28,16 L31,40 Q32,46 30,40 Q27,24 22,14 L18,16 Z");
                opacity: 0.6;
            }
            85% {
                d: path("M18,16 Q22,10 28,16 L29,20 Q29,22 28,20 Q24,13 22,14 L18,16 Z");
                opacity: 0.3;
            }
            100% {
                d: path("M18,16 Q22,10 28,16 L29,17 Q29,19 28,17 Q24,12 22,14 L18,16 Z");
                opacity: 0.4;
            }
        }

        .melting-cheese {
            animation: cheeseMelt 3s ease-in-out infinite;
        }

        @keyframes dripDrop {
            0% { transform: translateY(0); opacity: 0; }
            30% { transform: translateY(8px); opacity: 1; }
            60% { transform: translateY(18px); opacity: 0.8; }
            80% { transform: translateY(26px); opacity: 0.3; }
            100% { transform: translateY(32px); opacity: 0; }
        }

        .drip {
            animation: dripDrop 3s ease-in-out infinite;
        }

        h2 {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: 3px;
            margin: 0;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            line-height: 1;
        }

        .subtitle {
            color: #888;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Input alanları */
        .input-group {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 14px;
            padding: 8px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .input-group .icon {
            font-size: 18px;
            flex-shrink: 0;
        }
        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            outline: none;
        }
        .input-group input::placeholder {
            color: #555;
            font-family: 'Inter', sans-serif;
        }

        /* Butonlar */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(135deg, #dc2626, #d97706);
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.4);
        }
        .btn-primary:disabled {
            background: #2a2a35;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(245, 158, 11, 0.4);
            color: #f59e0b;
            margin-top: 12px;
        }
        .btn-outline:hover {
            background: rgba(245, 158, 11, 0.1);
            border-color: #f59e0b;
        }

        /* Yükleme alanı */
        .upload-area {
            margin: 20px 0;
        }
        input[type="file"] {
            display: none;
        }
        .upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(245, 158, 11, 0.25);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #aaa;
            letter-spacing: 0.5px;
        }
        .upload-label:hover {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
            color: #fff;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.1);
        }

        #preview {
            max-width: 100%;
            border-radius: 16px;
            margin: 15px 0;
            display: none;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        /* Scanner efekti */
        .scanner-box {
            display: none;
            margin: 20px auto 10px;
            width: 100%;
            height: 70px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(245, 158, 11, 0.15);
        }
        .scanner-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f59e0b, #ef4444, #f59e0b, transparent);
            box-shadow: 0 0 25px #f59e0b, 0 0 50px #dc2626;
            animation: scanDown 1.6s ease-in-out infinite;
        }
        @keyframes scanDown {
            0% { top: -5px; opacity: 0.5; }
            50% { top: 100%; opacity: 1; }
            100% { top: -5px; opacity: 0.5; }
        }
        .scanner-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'JetBrains Mono', monospace;
            color: #f59e0b;
            font-size: 13px;
            letter-spacing: 3px;
            text-shadow: 0 0 12px #dc2626;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Sonuç kutusu */
        .result-box {
            margin-top: 20px;
            text-align: left;
            background: rgba(15, 15, 22, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 18px;
            border-left: 4px solid #f59e0b;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px;
            display: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.7;
            color: #ccc;
            white-space: pre-line;
            word-break: break-word;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-box {
            background: rgba(220, 38, 38, 0.1);
            border-left: 4px solid #ef4444;
            color: #fca5a5;
            padding: 14px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }

        footer {
            margin-top: 20px;
            color: #444;
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        /* Geri butonu */
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #f59e0b;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="container">
        
        <!-- ========== SAYFA 1: API KEY GİRİŞ ========== -->
        <div class="page active" id="pageLogin">
            <div class="glass-card">
                <div class="logo-wrapper">
                    <div class="pizza-container">
                        <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                            <!-- Hamur -->
                            <circle cx="30" cy="30" r="27" fill="#d4a054" stroke="#b87a2b" stroke-width="2"/>
                            <!-- Sos -->
                            <circle cx="30" cy="30" r="24" fill="#c1272d"/>
                            <!-- Peynir -->
                            <circle cx="30" cy="30" r="22" fill="#f8d56b"/>
                            <!-- Pepperoni -->
                            <circle cx="22" cy="22" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="37" cy="26" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="28" cy="37" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="36" cy="35" r="4.5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <!-- Eriyen kaşar (sol üst) -->
                            <path class="melting-cheese" 
                                  d="M20,14 Q24,10 30,14 L31,16 Q31,18 30,16 Q26,12 24,14 L20,14 Z" 
                                  fill="#fff8dc" opacity="0.6"/>
                            <!-- Damlayan kaşar -->
                            <circle class="drip" cx="27" cy="36" r="3" fill="#fff8dc" opacity="0">
                                <animate attributeName="cy" values="34;42;50;50" dur="3s" repeatCount="indefinite"/>
                                <animate attributeName="opacity" values="0;1;0.6;0" dur="3s" repeatCount="indefinite"/>
                                <animate attributeName="r" values="2;3.5;4;1" dur="3s" repeatCount="indefinite"/>
                            </circle>
                        </svg>
                    </div>
                    <h2>25 MAX</h2>
                </div>
                <p class="subtitle">AI Face Rating Terminal</p>

                <div class="input-group">
                    <span class="icon">🔑</span>
                    <input type="password" id="apiKeyInput" placeholder="Gemini API Key giriniz..." autocomplete="off">
                </div>

                <button class="btn btn-primary" id="btnLogin">
                    GİRİŞ YAP
                </button>

                <div class="error-box" id="loginError"></div>
                <footer>v5.0 • Blackpill Engine</footer>
            </div>
        </div>

        <!-- ========== SAYFA 2: YÜZ ANALİZ ========== -->
        <div class="page" id="pageAnalyze">
            <div class="glass-card">
                <div class="logo-wrapper">
                    <div class="pizza-container" style="width:45px;height:45px;">
                        <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="30" cy="30" r="27" fill="#d4a054" stroke="#b87a2b" stroke-width="2"/>
                            <circle cx="30" cy="30" r="24" fill="#c1272d"/>
                            <circle cx="30" cy="30" r="22" fill="#f8d56b"/>
                            <circle cx="22" cy="22" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="37" cy="26" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="28" cy="37" r="5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <circle cx="36" cy="35" r="4.5" fill="#8b1a1a" stroke="#5c1010" stroke-width="1"/>
                            <path class="melting-cheese" 
                                  d="M20,14 Q24,10 30,14 L31,16 Q31,18 30,16 Q26,12 24,14 L20,14 Z" 
                                  fill="#fff8dc" opacity="0.6"/>
                            <circle class="drip" cx="27" cy="36" r="3" fill="#fff8dc" opacity="0">
                                <animate attributeName="cy" values="34;42;50;50" dur="3s" repeatCount="indefinite"/>
                                <animate attributeName="opacity" values="0;1;0.6;0" dur="3s" repeatCount="indefinite"/>
                                <animate attributeName="r" values="2;3.5;4;1" dur="3s" repeatCount="indefinite"/>
                            </circle>
                        </svg>
                    </div>
                    <h2 style="font-size:1.5rem;">25 MAX</h2>
                </div>
                <p class="subtitle">Yüz Analizi</p>

                <div class="upload-area">
                    <label for="imageInput" class="upload-label" id="fileLabel">
                        📸 FOTOĞRAF SEÇ (GALERİ / KAMERA)
                    </label>
                    <input type="file" id="imageInput" accept="image/*">
                </div>

                <img id="preview" alt="Seçilen fotoğraf">

                <button class="btn btn-primary" id="btnAnalyze">
                    <span id="btnText">ANALİZİ BAŞLAT</span>
                </button>

                <button class="btn btn-outline" id="btnLogout">
                    ↩ ÇIKIŞ YAP
                </button>

                <div class="scanner-box" id="scannerBox">
                    <div class="scanner-beam"></div>
                    <div class="scanner-label">TARANIYOR...</div>
                </div>

                <div class="error-box" id="analyzeError"></div>
                <div class="result-box" id="result"></div>
            </div>
        </div>

    </div>

    <script>
        const MODEL_NAME = 'gemini-1.5-pro';
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent`;
        
        let base64Image = "";
        let currentMimeType = "image/jpeg";
        const MAX_SIZE_MB = 5;

        // ---------- SAYFA GEÇİŞLERİ ----------
        const pageLogin = document.getElementById('pageLogin');
        const pageAnalyze = document.getElementById('pageAnalyze');

        function showPage(page) {
            pageLogin.classList.remove('active');
            pageAnalyze.classList.remove('active');
            page.classList.add('active');
        }

        // ---------- SAYFA YÜKLENİNCE ----------
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('25max_key_v6');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        });

        // ---------- GİRİŞ BUTONU ----------
        document.getElementById('btnLogin').addEventListener('click', () => {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const errorBox = document.getElementById('loginError');
            
            errorBox.style.display = 'none';

            if (!apiKey || apiKey.length < 20) {
                errorBox.textContent = '⚠️ Geçerli bir Gemini API Key giriniz!';
                errorBox.style.display = 'block';
                return;
            }

            localStorage.setItem('25max_key_v6', apiKey);
            showPage(pageAnalyze);
        });

        // ---------- ÇIKIŞ BUTONU ----------
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('25max_key_v6');
            document.getElementById('apiKeyInput').value = '';
            resetUpload();
            document.getElementById('result').style.display = 'none';
            document.getElementById('analyzeError').style.display = 'none';
            document.getElementById('scannerBox').style.display = 'none';
            showPage(pageLogin);
        });

        // ---------- GÖRSEL YÜKLEME ----------
        document.getElementById('imageInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const errorBox = document.getElementById('analyzeError');
            const preview = document.getElementById('preview');
            const fileLabel = document.getElementById('fileLabel');
            
            errorBox.style.display = 'none';
            document.getElementById('result').style.display = 'none';

            if (!file) {
                resetUpload();
                return;
            }

            if (!file.type.startsWith('image/')) {
                showAnalyzeError("Geçersiz dosya! JPEG, PNG veya WebP seçin.");
                resetUpload();
                return;
            }

            if (file.size > MAX_SIZE_MB * 1024 * 1024) {
                showAnalyzeError(`Dosya ${MAX_SIZE_MB}MB'dan küçük olmalı!`);
                resetUpload();
                return;
            }

            currentMimeType = file.type;
            fileLabel.innerHTML = `✓ ${file.name} (${(file.size/1024).toFixed(1)} KB)`;

            const reader = new FileReader();
            reader.onerror = () => { showAnalyzeError("Dosya okunamadı!"); resetUpload(); };
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    if (img.width < 80 || img.height < 80) {
                        showAnalyzeError("Fotoğraf çok küçük (min 80x80 piksel).");
                        resetUpload();
                        return;
                    }
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    const parts = e.target.result.split(',');
                    base64Image = parts.length === 2 ? parts[1] : "";
                };
                img.onerror = () => { showAnalyzeError("Görsel bozuk veya geçersiz!"); resetUpload(); };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        function resetUpload() {
            document.getElementById('imageInput').value = "";
            document.getElementById('preview').style.display = 'none';
            document.getElementById('fileLabel').innerHTML = '📸 FOTOĞRAF SEÇ (GALERİ / KAMERA)';
            base64Image = "";
            currentMimeType = "image/jpeg";
        }

        function showAnalyzeError(msg) {
            const box = document.getElementById('analyzeError');
            box.textContent = '⚠️ ' + msg;
            box.style.display = 'block';
            setTimeout(() => { if (box) box.style.display = 'none'; }, 5000);
        }

        // ---------- ANALİZ BUTONU ----------
        document.getElementById('btnAnalyze').addEventListener('click', async () => {
            const apiKey = localStorage.getItem('25max_key_v6');
            const btn = document.getElementById('btnAnalyze');
            const btnText = document.getElementById('btnText');
            const scanner = document.getElementById('scannerBox');
            const resultDiv = document.getElementById('result');
            const errorBox = document.getElementById('analyzeError');

            resultDiv.style.display = 'none';
            errorBox.style.display = 'none';

            if (!apiKey) {
                showAnalyzeError("API Key bulunamadı! Lütfen tekrar giriş yapın.");
                return;
            }
            if (!base64Image) {
                showAnalyzeError("Lütfen önce bir fotoğraf seçin!");
                return;
            }

            btn.disabled = true;
            btnText.textContent = "ANALİZ EDİLİYOR...";
            scanner.style.display = 'block';

            const prompt = `Sen bir yapay zeka estetik derecelendirme motorusun. Yüklenen insan yüzünü acımasızca, yalnızca biyo-geometrik ve bilimsel kriterlere göre değerlendir. Kesinlikle iltifat etme, duygusal yorum katma. Türkçe konuş, fakat terimleri İngilizce orijinal kullan (gonial angle, canthal tilt, UEE, midface ratio, IPD, scleral show, vs.).

Aşağıdaki 5 kategoriyi 1-10 arası puanla, kısa yorumlar yap ve en son "MOG SKORU" ver.

1. ÇENE & KEMİK (Gonial Angle, Ramus, Chin, Zygos)
2. GÖZ BÖLGESİ (Canthal Tilt, UEE, Brow Ridge, IPD)
3. ORTA YÜZ & BURUN (Midface Ratio, Dorsal, Tip)
4. DUDAK & ALT YÜZ (Lower Third, Philtrum)
5. SİMETRİ & CİLT/SAÇ (Asimetri, Akne, Norwood)

Çıktı formatın tam olarak şu olmalı:
---
**🔥 25 MAX ANALİZ RAPORU**

**Çene & Kemik: [X.X]/10**
[Yorum]

**Göz Bölgesi: [X.X]/10**
[Yorum]

**Orta Yüz & Burun: [X.X]/10**
[Yorum]

**Dudak & Alt Yüz: [X.X]/10**
[Yorum]

**Simetri & Sağlık: [X.X]/10**
[Yorum]

---
**🏆 GENEL MOG SKORU: [X.X] / 10**

**En Büyük Kusur (Failo):** [Tek cümle]
**En Güçlü Yan (Halo):** [Tek cümle]
---
Gerçekler acıtır, acımasız ol.`;

            try {
                const response = await fetch(`${API_URL}?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: currentMimeType, data: base64Image } }
                            ]
                        }],
                        generationConfig: { temperature: 0.3, maxOutputTokens: 1100 }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!aiText) throw new Error("AI yanıtı boş geldi, tekrar deneyin.");

                let formatted = aiText
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/\*\*(.*?)\*\*/g, '<strong style="color:#f59e0b;">$1</strong>')
                    .replace(/---/g, '<hr style="border-color:#333; margin:15px 0;">')
                    .replace(/\n/g, '<br>');

                resultDiv.innerHTML = formatted;
                resultDiv.style.display = 'block';
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (err) {
                showAnalyzeError('Hata: ' + err.message);
            } finally {
                btn.disabled = false;
                btnText.textContent = "ANALİZİ BAŞLAT";
                scanner.style.display = 'none';
            }
        });

    </script>
</body>
</html>
