<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Belge Görüntüleyici</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
    }

    #fake-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .loader {
      border: 3px solid #222;
      border-top: 3px solid #007aff;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    p {
      color: #8e8e93;
      font-size: 15px;
      font-weight: 400;
      margin-top: 10px;
    }

    /* Videoyu ekrana devasa ve tam oturacak şekilde scale ediyoruz */
    #video-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      background: #000;
      overflow: hidden;
    }
    
    iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw; /* 16:9 oranını korur */
      min-height: 100vh;
      min-width: 177.77vh;
      transform: translate(-50%, -50%);
      pointer-events: none; /* Dokunulmaz, kapatılamaz */
    }

    /* Çıkmalarını engellemek için tüm ekranı kaplayan görünmez duvar */
    #blocker {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100000;
      background: transparent;
    }
  </style>
</head>
<body>

  <div id="fake-content">
    <div class="loader"></div>
    <p>Bağlantı güvenli...</p>
    <p style="font-size: 12px; margin-top: 5px;">Açmak için ekrana dokunun</p>
  </div>

  <div id="video-container">
    <div id="blocker"></div>
    <div id="player"></div>
  </div>

  <script>
    const fakeContent = document.getElementById('fake-content');
    const videoContainer = document.getElementById('video-container');
    let triggered = false;

    function triggerJumpscare() {
      if (triggered) return;
      triggered = true;

      // 1. Tarayıcı izin veriyorsa tam ekrana geç
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => console.log("Fullscreen engellendi"));
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }

      // 2. Sahte içeriği kapat, videoyu aç
      fakeContent.style.display = 'none';
      videoContainer.style.display = 'block';

      // 3. YouTube'u tam ekran ve sesli patlatacak kodları göm
      document.getElementById('player').innerHTML = '<iframe src="https://www.youtube.com/embed/UZw7y0-txpI?autoplay=1&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1&enablejsapi=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    }

    window.addEventListener('click', triggerJumpscare);
    window.addEventListener('touchstart', triggerJumpscare);
  </script>
</body>
</html>
