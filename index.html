<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belge Görüntüleyici</title>
  
  <!-- Instagram / WhatsApp Gizli Önizleme -->
  <meta property="og:title" content="Paylaşılan Belge" />
  <meta property="og:description" content="Dosyayı görüntülemek için dokun." />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
    }

    /* Sahte Yüklenme Ekranı (Kurbanın ilk göreceği yer) */
    #fake-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: #fff;
      text-align: center;
      padding: 20px;
      background: #000;
    }

    .loader {
      border: 3px solid #222;
      border-top: 3px solid #007aff;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    p {
      color: #8e8e93;
      font-size: 15px;
      font-weight: 400;
      margin-top: 10px;
    }

    /* Videonun oynatılacağı gizli katman */
    #scare-video {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Ekranı tam doldurur */
      z-index: 99999;
      background: #000;
    }
  </style>
</head>
<body>

  <!-- Tetikleyici Alan (Masum Ekran) -->
  <div id="fake-content">
    <div class="loader"></div>
    <p>Bağlantı güvenli...</p>
    <p style="font-size: 12px; margin-top: 5px;">Açmak için ekrana dokunun</p>
  </div>

  <!-- Jumpscare Videosu (GitHub'a attığın dosya) -->
  <video id="scare-video" playsinline webkit-playsinline preload="auto">
    <source src="jumpscare.mp4" type="video/mp4" />
  </video>

  <script>
    const fakeContent = document.getElementById('fake-content');
    const scareVideo = document.getElementById('scare-video');

    let triggered = false;

    function triggerJumpscare() {
      if (triggered) return;
      triggered = true;

      // Kurban ekrana dokunduğu an tam ekran moduna al (Destekliyorsa)
      try {
        const elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } catch (err) {
        console.log("Fullscreen hatası (önemsiz):", err);
      }

      // Masum ekranı yok et, videoyu aç
      fakeContent.style.display = 'none';
      scareVideo.style.display = 'block';

      // Sesi aç ve videoyu başlat
      scareVideo.volume = 1.0;
      scareVideo.muted = false;
      scareVideo.play().catch(e => {
        // Eğer bir güvenlik engeline takılırsa sessiz oynatmayı dener
        console.log("Sesli oynatma engellendi, alternatif deneniyor", e);
      });
    }

    // Ekrana tıklandığında veya dokunulduğunda tetikle
    window.addEventListener('click', triggerJumpscare);
    window.addEventListener('touchstart', triggerJumpscare);
  </script>
</body>
</html>
